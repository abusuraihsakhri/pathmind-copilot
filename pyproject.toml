[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pathmind-copilot"
version = "1.0.0"
description = "Autonomous Digital Pathology Diagnostic Supervision & Synoptic Reporting Engine System."
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
pathmind = "pathmind.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/pathmind-copilot"
Repository = "https://github.com/abusuraihsakhri/pathmind-copilot.git"
